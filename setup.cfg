[flake8]
max-line-length = 120
# E203 and W503 conflict with black.
extend-ignore = E203, W503
exclude = .git, __pycache__, build, dist, .venv
per-file-ignores =
    # Console reporting.
    kalematerials/utils/reporting.py: T201
    # CLI output.
    examples/*: T201
    # Configure plotting before imports.
    examples/*/main.py: E402
