[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalematerials"
version = "0.1.0"
description = "Multimodal materials AI for the PyKale ecosystem."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "PyKale" }]
keywords = ["materials", "machine learning", "multimodal", "pykale"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Materials",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "xgboost>=1.7",
    "shap>=0.44",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pymatgen>=2023.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
examples = [
    "hydra-core>=1.3",
]
dev = [
    "kalematerials[examples]",
    "black==26.5.1",
    "isort==9.0.1",
    "flake8==7.3.0",
    "flake8-print",
    "mypy",
    "pre-commit",
    "pytest>=7.4",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/pykale/materials"
Repository = "https://github.com/pykale/materials"
Issues = "https://github.com/pykale/materials/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["kalematerials*"]
namespaces = true

[tool.black]
line-length = 120
target-version = ["py311", "py312"]

[tool.isort]
known_first_party = [
    "examples",
    "kalematerials",
    "tests",
]
profile = "black"
line_length = 120
force_sort_within_sections = "False"
order_by_type = "False"

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
